<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NoteIdea</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body class="main">
    <main class="workspace">
      <header class="app-header">
        <div>
          <h1>NoteIdea</h1>
          <p id="workspace-label">本地 Markdown 笔记</p>
        </div>
        <div class="header-actions">
          <button id="choose-vault" type="button">选择工作区</button>
          <button id="diagnostics-toggle" class="icon-button" type="button" title="显示诊断面板" aria-label="显示诊断面板">i</button>
        </div>
      </header>

      <section id="welcome-card" class="welcome-card">
        <div class="welcome-mark">N</div>
        <h2>从一个工作区开始</h2>
        <p>选择一个文件夹，NoteIdea 会在这里显示其中的 Markdown 笔记。</p>
        <button id="welcome-choose" type="button">选择工作区</button>
      </section>

      <section id="vault-card" class="vault-notice hidden">
        <div>
          <strong>工作区不可用</strong>
          <p id="vault-reason"></p>
        </div>
      </section>

      <section id="editor-workspace" class="editor-workspace hidden">
        <aside class="note-sidebar">
          <div class="sidebar-header">
            <span>笔记</span>
            <div class="sidebar-actions">
              <button id="new-note" class="icon-button" type="button" title="新建笔记" aria-label="新建笔记">+</button>
              <button id="refresh-notes" class="icon-button" type="button" title="刷新文件树" aria-label="刷新文件树">&#8635;</button>
            </div>
          </div>
          <div id="tree-status" class="tree-status">正在读取笔记...</div>
          <nav id="note-tree" class="note-tree" aria-label="笔记文件树"></nav>
          <p class="tree-hint">外部改动需手动刷新</p>
        </aside>

        <section class="editor-panel">
          <div class="editor-header">
            <span id="note-title">选择一篇笔记</span>
            <span id="note-path"></span>
          </div>
          <div id="editor-empty" class="editor-empty">从左侧打开一篇 Markdown 笔记</div>
          <div id="note-editor" class="note-editor hidden"></div>
        </section>
      </section>

      <section id="diagnostics" class="diagnostics hidden">
        <div id="warnings"></div>
        <section id="failed-card" class="diagnostic-section hidden">
          <h2>写入失败</h2>
          <ul id="failed-list" class="failed"></ul>
        </section>
        <section class="diagnostic-section">
          <div class="diagnostic-heading"><h2>热键延迟</h2><button id="refresh" type="button">刷新</button></div>
          <div id="stats" class="stats">尚无数据。</div>
          <ul id="samples" class="samples"></ul>
        </section>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
